<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber City bench</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b0d14; color: #d9e1f2; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: #9aa6bf; max-width: 60ch; }
  button { min-height: 44px; padding: 0 20px; font: inherit; color: #0b0d14; background: #5ef1ff; border: 0; border-radius: 8px; }
  #status { margin: 12px 0; color: #ffb02e; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: #131726; padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
<h1>Cyber City device bench</h1>
<p>Runs the Megacity device check on this device (docs/MEGACITY.md §11.6): sim days at 1, 9 and 25 districts, saves,
loading and the micro-benchmark. Keep the screen on; it takes a few minutes. Add <code>?quota=1</code> to probe the
storage quota, <code>?quick=1</code> for a shorter run.</p>
<button id="run" type="button">Run all</button>
<div id="status">idle</div>
<pre id="out"></pre>
<script src="./bench.js"></script>
</body>
</html>
